name: Regenerate bun.lock for Dependabot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate-bun-lock:
    name: Sync bun.lock after Dependabot update
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies and regenerate bun.lock
        run: bun install

      - name: Commit updated lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): regenerate bun.lock for Dependabot update"
          file_pattern: "bun.lock"

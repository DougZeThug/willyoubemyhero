name: Factory — repair failing CI

# OPT-IN. Inert until the repository variable FACTORY_CI_REPAIR is "true".
# Fires only when CI fails on a factory/* or claude/* branch (never main, never
# forks), and the repair budget (3 attempts per issue) is enforced by the tool.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      vars.FACTORY_CI_REPAIR == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'factory/') || startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.11" }
      - run: bun install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /factory-fix CI run ${{ github.event.workflow_run.html_url }} failed on branch
            ${{ github.event.workflow_run.head_branch }}. Fetch the failing job logs with the GitHub
            tools, reproduce, repair, push to that same branch. If three attempts do not fix it,
            stop and comment the diagnosis on the PR.
          claude_args: --max-turns 60

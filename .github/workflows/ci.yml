name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref. A new push to a PR cancels the superseded run, but
# pushes to main are never cancelled so every commit on the Lovable-synced
# branch gets a definitive pass/fail instead of a gap in the history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match local dev. setup-bun caches the bun binary itself,
          # not the dependency cache — see the actions/cache step below.
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # bunfig.toml's minimumReleaseAge is a resolution-time guard; a frozen
      # install re-resolves nothing, so it cannot affect this step. The build
      # needs no secrets — every process.env read in src/ is inside a function
      # body, and the VITE_* vars come from the committed .env.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # There is deliberately no typecheck step yet. `bun run typecheck` exists
      # in package.json and works locally, but currently reports 79 errors —
      # all of them because src/integrations/supabase/types.ts was never
      # regenerated after the 20260727130000_member_identity_and_social
      # migration, so awards_locked / award_votes / target_participant_id /
      # event_participant_id are missing from the generated DB types. Regenerate
      # types.ts (`supabase gen types`), then add back:
      #
      #   - name: Typecheck
      #     run: bun run typecheck
      #
      # Note esbuild strips types without checking them, so until that step
      # exists this workflow does not gate type errors.
      - name: Build
        run: bun run build

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref. A new push to a PR cancels the superseded run, but
# pushes to main are never cancelled so every commit on the Lovable-synced
# branch gets a definitive pass/fail instead of a gap in the history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match local dev. setup-bun caches the bun binary itself,
          # not the dependency cache — see the actions/cache step below.
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # bun.lock must only ever record registry-relative resolutions (the empty
      # "" field), never an absolute tarball host. Resolving in a sandbox that
      # fronts npm with a private pull-through mirror bakes that mirror's host
      # into every package it resolved, and the lockfile stops being portable:
      # anywhere the mirror is unreachable, bun retries those fetches forever
      # and `bun install` never exits. Catch it here rather than let it strand
      # a checkout for minutes with no output. Runs before install so it fails
      # in seconds.
      - name: Check lockfile is registry-portable
        run: |
          if grep -nE '", "https://' bun.lock; then
            echo "::error file=bun.lock::bun.lock pins packages to absolute tarball URLs. Re-resolve against the public registry so the resolution field is \"\"."
            exit 1
          fi
          echo "bun.lock records no absolute tarball hosts."

      # bunfig.toml's minimumReleaseAge is a resolution-time guard; a frozen
      # install re-resolves nothing, so it cannot affect this step. The build
      # needs no secrets — every process.env read in src/ is inside a function
      # body, and the VITE_* vars come from the committed .env.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Advisory for now. The suite is new, so a red test reports itself without
      # blocking a Lovable sync; drop continue-on-error once it has settled and
      # this becomes a real gate like lint and typecheck.
      - name: Unit tests
        run: bun run test
        continue-on-error: true

      - name: Build
        run: bun run build

  # Grants, RLS policies and the award RPCs, against a real Postgres.
  #
  # No Docker and no Supabase CLI: the harness in tests/db/cluster.ts runs initdb
  # itself and applies bootstrap.sql plus every migration from empty, which also
  # means a migration that no longer replays fails here.
  db:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runner already ships postgres binaries; PG_BIN_DIR points the harness
      # at them rather than leaving it to guess a version-specific path.
      - name: Locate Postgres
        run: echo "PG_BIN_DIR=$(dirname "$(command -v pg_ctl || echo /usr/lib/postgresql/16/bin/pg_ctl)")" >> "$GITHUB_ENV"

      - name: Database tests
        run: bun run test:db

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Chromium only. Both Playwright projects use it — the phone project takes
      # the iPhone preset's viewport and touch support, not WebKit.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Server functions are stubbed in the browser, so the suite never reaches
      # Supabase. These values exist only so the dev server starts, and point at
      # a dead address so anything unstubbed fails loudly instead of quietly
      # finding the live project.
      - name: E2E tests
        run: bun run test:e2e
        env:
          SESSION_SECRET: e2e-session-secret
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_PUBLISHABLE_KEY: e2e-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
